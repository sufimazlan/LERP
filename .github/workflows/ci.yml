name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job, cancelled when a newer commit arrives, keeps CI inside GitHub's free minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: lerp
      DB_PASSWORD: lerp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Create a test role without SUPERUSER (superusers bypass row-level security)
        run: >-
          psql "postgresql://postgres:postgres@localhost:5432/postgres"
          -c "CREATE ROLE lerp LOGIN PASSWORD 'lerp' CREATEDB NOSUPERUSER NOBYPASSRLS"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run --settings=lerp.settings_test
      - run: pytest
